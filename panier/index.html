<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier Commun a déménagé</title>
<link rel="canonical" href="https://remix4449.github.io/panier-commun/">
<style>
  :root{color-scheme:light dark}
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f3f5f1;color:#17211c;text-align:center;
  }
  @media (prefers-color-scheme:dark){body{background:#121714;color:#e7ece8}}
  main{max-width:34rem}
  h1{font-size:1.45rem;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0 0 18px;opacity:.82}
  a.go{
    display:inline-block;padding:13px 22px;border-radius:999px;
    background:#1d5c46;color:#fff;text-decoration:none;font-weight:700;
  }
  code{font-size:.86em;opacity:.7}
</style>
</head>
<body>
<main>
  <h1>Panier Commun a déménagé</h1>
  <p>L’application vit maintenant à sa propre adresse. Cette page ne sert plus
    qu’à vous y conduire — elle s’ouvre toute seule dans un instant.</p>
  <p><a class="go" href="https://remix4449.github.io/panier-commun/">Ouvrir Panier Commun</a></p>
  <p><code>remix4449.github.io/panier-commun/</code></p>
</main>
<script>
/* L'ancienne adresse a pu être installée sur l'écran d'accueil : son service
   worker servait la coquille depuis le cache et continuerait à afficher la
   vieille application. On le retire, on vide ses caches, puis on redirige. */
(function(){
  "use strict";
  var CIBLE = "https://remix4449.github.io/panier-commun/";
  var partir = function(){ location.replace(CIBLE); };
  var taches = [];
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      taches.push(navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }));
      }));
    }
    if(window.caches && caches.keys){
      taches.push(caches.keys().then(function(noms){
        return Promise.all(noms.map(function(n){ return caches.delete(n); }));
      }));
    }
  }catch(e){}
  /* Le ménage ne doit jamais retenir la redirection. */
  setTimeout(partir, 1500);
  if(taches.length) Promise.all(taches).then(partir, partir); else partir();
})();
</script>
</body>
</html>
