<title>Panier Commun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EFF2EF;
  --surface:#FFFFFF;
  --surface-2:#F6F8F5;
  --ink:#131D1B;
  --muted:#65736F;
  --line:#DDE4DF;
  --line-strong:#C6D1CB;
  --accent:#0E5C55;
  --accent-ink:#0A403B;
  --accent-soft:#D8EAE5;
  --citron:#9A7100;
  --citron-soft:#F4EBCC;
  --danger:#9B3922;
  --shadow:0 1px 2px rgba(19,29,27,.06), 0 8px 24px -16px rgba(19,29,27,.35);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1312;
    --surface:#171F1D;
    --surface-2:#1D2724;
    --ink:#E7EEEB;
    --muted:#94A29D;
    --line:#293431;
    --line-strong:#3A4845;
    --accent:#5FC5B3;
    --accent-ink:#8FDCCD;
    --accent-soft:#123430;
    --citron:#E0BE5C;
    --citron-soft:#2C2716;
    --danger:#E08A70;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1312;
  --surface:#171F1D;
  --surface-2:#1D2724;
  --ink:#E7EEEB;
  --muted:#94A29D;
  --line:#293431;
  --line-strong:#3A4845;
  --accent:#5FC5B3;
  --accent-ink:#8FDCCD;
  --accent-soft:#123430;
  --citron:#E0BE5C;
  --citron-soft:#2C2716;
  --danger:#E08A70;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 10px;
}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0;
  font-variation-settings:"opsz" 24;
}
.sync{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);
}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-state="live"] .dot{background:var(--accent)}
.sync[data-state="live"]{color:var(--accent);border-color:var(--accent-soft)}
.sync[data-state="local"] .dot{background:var(--citron)}
.sync[data-state="local"]{color:var(--citron);border-color:var(--citron-soft)}

.viewhead{display:flex;align-items:center;gap:10px;margin-top:10px}
.viewhead h2{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-size:15px;font-weight:500;margin:0;letter-spacing:.01em;color:var(--muted);
}
.viewhead .count{
  font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;
}
.headactions{margin-left:auto;display:flex;gap:8px}
.btn{
  border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:var(--ground)}
.btn-primary:hover{filter:brightness(1.08);color:var(--surface)}
:root[data-theme="dark"] .btn-primary:hover{color:var(--ground)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--danger);border-color:transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- views ---------- */
.view{flex:1;padding:14px 16px 104px;display:none}
.view.active{display:block}

.empty{
  border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;
  background:var(--surface-2);
}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-family:"Bricolage Grotesque",sans-serif}

/* ---------- recipes ---------- */
.recipes{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.tile{
  display:flex;align-items:stretch;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s;
}
.tile[data-inlist="1"]{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft) 0 4px,var(--surface) 4px)}
.tile-open{flex:1;text-align:left;padding:13px 2px 13px 15px;display:block;min-width:0}
.tile-name{
  font-family:"Bricolage Grotesque","Karla",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:-.01em;margin:0 0 3px;text-wrap:balance;
}
.tile-meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tile-meta .cat{
  text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;
  color:var(--citron);background:var(--citron-soft);border-radius:4px;padding:2px 6px;font-weight:700;
}
.tile-meta .num{font-family:"DM Mono",ui-monospace,monospace}
.tile-check{
  width:66px;flex:none;border-left:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--surface-2);color:var(--muted);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;text-align:center;line-height:1.15;padding:6px 4px;
}
.tile-check .box{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);transition:.15s;
}
.tile-check .box svg{width:16px;height:16px;stroke:var(--surface);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tile[data-inlist="1"] .tile-check{background:var(--accent-soft);color:var(--accent)}
.tile[data-inlist="1"] .tile-check .box{background:var(--accent);border-color:var(--accent)}
.tile[data-inlist="1"] .tile-check .box svg{opacity:1;stroke:var(--surface)}
:root[data-theme="dark"] .tile[data-inlist="1"] .tile-check .box svg,
:root:not([data-theme="light"]) .tile[data-inlist="1"] .tile-check .box svg{stroke:var(--ground)}

/* ---------- search / quick add ---------- */
.addbar{position:relative;margin-bottom:14px}
.addbar form{display:flex;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:4px 4px 4px 12px;
  box-shadow:var(--shadow);
}
.addbar form:focus-within{border-color:var(--accent)}
.addbar svg.mag{width:17px;height:17px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.addbar input{flex:1;min-width:0;border:none;background:none;padding:9px 0;outline:none}
.addbar input::placeholder{color:var(--muted)}
.addbar .go{
  background:var(--accent);color:var(--surface);border-radius:9px;width:38px;height:38px;flex:none;
  display:grid;place-items:center;
}
:root[data-theme="dark"] .addbar .go{color:var(--ground)}
.addbar .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.parsed{
  font-size:12px;color:var(--muted);padding:6px 4px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.parsed b{font-family:"DM Mono",ui-monospace,monospace;color:var(--ink);font-weight:500}
.parsed .ray{color:var(--accent)}
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;max-height:46vh;overflow-y:auto;
}
.suggest button{
  display:flex;width:100%;text-align:left;gap:10px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line);font-size:14.5px;
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button.on{background:var(--accent-soft)}
.suggest .r{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ---------- shopping list ---------- */
.aisle{margin-bottom:20px}
.aisle-head{
  display:flex;align-items:center;gap:9px;margin:0 0 8px;padding:0 2px;
}
.aisle-head h3{
  font-family:"Bricolage Grotesque",sans-serif;font-size:12px;font-weight:700;margin:0;
  text-transform:uppercase;letter-spacing:.12em;color:var(--accent);
}
.aisle-head .rule{flex:1;height:1px;background:var(--line-strong)}
.aisle-head .n{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item-row{display:flex;align-items:center;gap:11px;padding:9px 12px}
.tick{
  width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);
}
.tick svg{width:13px;height:13px;stroke:var(--surface);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item[data-done="1"] .tick{background:var(--accent);border-color:var(--accent)}
.item[data-done="1"] .tick svg{opacity:1}
:root[data-theme="dark"] .item[data-done="1"] .tick svg{stroke:var(--ground)}
.item-body{flex:1;min-width:0;text-align:left;padding:2px 0}
.item-name{display:block;font-size:15.5px;line-height:1.25}
.item-from{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item[data-done="1"] .item-name{text-decoration:line-through;color:var(--muted)}
.qty{
  font-family:"DM Mono",ui-monospace,monospace;font-size:13px;flex:none;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.item[data-done="1"] .qty{opacity:.5}
.editor{display:none;padding:0 12px 12px 47px;gap:8px;flex-wrap:wrap;align-items:center}
.item.editing .editor{display:flex}
.editor input[type="number"]{width:74px}
.editor input,.editor select{
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:14px;outline:none;
}
.editor input:focus,.editor select:focus{border-color:var(--accent)}
.editor input[name="unit"]{width:80px}
.editor select{flex:1;min-width:130px}
.editor .rm{color:var(--danger);font-size:13px;padding:6px 8px;border-radius:8px}
.editor .rm:hover{background:var(--citron-soft)}

/* ---------- week ---------- */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.day.today{border-color:var(--accent)}
.day-name{
  font-family:"Bricolage Grotesque",sans-serif;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;padding:8px 14px 6px;color:var(--muted);display:flex;gap:8px;align-items:center;
}
.day.today .day-name{color:var(--accent)}
.day.today .day-name::after{content:"aujourd'hui";text-transform:none;letter-spacing:.02em;font-weight:500;font-size:10.5px;opacity:.8}
.slot{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.slot .when{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);width:38px;flex:none;
}
.slot .what{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .what.none{color:var(--muted);font-style:italic;font-size:14px}
.slot .chev{width:16px;height:16px;stroke:var(--line-strong);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.slot:hover{background:var(--surface-2)}
.slot:hover .chev{stroke:var(--accent)}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;max-width:620px;margin:0 auto;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 5px;
  color:var(--muted);font-size:11px;letter-spacing:.03em;border-radius:10px;position:relative;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--accent);font-weight:700}
.tab .badge{
  position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;
  background:var(--citron);color:#1b1400;border-radius:999px;font-size:10px;font-weight:700;
  display:grid;place-items:center;font-family:"DM Mono",monospace;
}

/* ---------- sheets ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(10,18,16,.5);
  display:none;align-items:flex-end;justify-content:center;
}
.scrim.open{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:620px;max-height:92dvh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:rise .22s ease-out;
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{
  display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.sheet-head h2{
  font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em;
  text-wrap:balance;flex:1;
}
.sheet-close{width:32px;height:32px;flex:none;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.sheet-close svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet-body{padding:16px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.sheet-foot .btn{flex:1;justify-content:center;padding:12px 14px;font-size:15px}

.servings{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.stepper button{width:34px;height:32px;display:grid;place-items:center;font-size:18px;color:var(--accent);line-height:1}
.stepper button:hover{background:var(--accent-soft)}
.stepper span{
  min-width:34px;text-align:center;font-family:"DM Mono",monospace;font-size:14px;color:var(--ink);
  border-left:1px solid var(--line);border-right:1px solid var(--line);padding:5px 0;
}
.subhead{
  font-family:"Bricolage Grotesque",sans-serif;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;color:var(--accent);margin:22px 0 9px;display:flex;align-items:center;gap:9px;
}
.subhead:first-child{margin-top:0}
.subhead .rule{flex:1;height:1px;background:var(--line)}
.ing{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ing li{display:flex;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.ing .q{font-family:"DM Mono",monospace;font-size:13.5px;color:var(--citron);min-width:72px;flex:none;font-variant-numeric:tabular-nums}
.ing .n{flex:1}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{
  counter-increment:s;display:flex;gap:13px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5;
}
.steps li::before{
  content:counter(s);flex:none;width:23px;height:23px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-family:"DM Mono",monospace;font-size:12px;
  display:grid;place-items:center;margin-top:2px;
}
.steps li:last-child{border-bottom:none}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;
  padding:10px 11px;font-size:15px;outline:none;
}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.ingrow{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.ingrow input.q{width:58px;flex:none;text-align:center}
.ingrow input.u{width:64px;flex:none}
.ingrow input.n{flex:1;min-width:0}
.ingrow select{flex:none;width:42px;padding:10px 4px;font-size:12px}
.ingrow .x{width:28px;flex:none;color:var(--muted);font-size:19px;line-height:1;text-align:center}
.ingrow .x:hover{color:var(--danger)}
.picklist{list-style:none;margin:0;padding:0}
.picklist button{
  display:flex;width:100%;text-align:left;align-items:center;gap:11px;padding:12px 4px;
  border-bottom:1px solid var(--line);font-size:15.5px;
}
.picklist .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--citron);margin-left:auto}
.picklist button:hover{color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:18px 2px 0;text-align:center}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>

<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <h1 class="brand">Panier Commun</h1>
      <span class="sync" id="sync" data-state="wait"><span class="dot"></span><span id="syncLabel">Connexion</span></span>
    </div>
    <div class="viewhead">
      <h2 id="viewTitle">Recettes</h2>
      <span class="count" id="viewCount"></span>
      <div class="headactions" id="headActions"></div>
    </div>
  </header>

  <section class="view active" id="view-recipes">
    <ul class="recipes" id="recipeList"></ul>
  </section>

  <section class="view" id="view-list">
    <div class="addbar">
      <form id="addForm" autocomplete="off">
        <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="addInput" placeholder="2 kg pommes de terre…" aria-label="Ajouter un article">
        <button class="go" type="submit" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </form>
      <div class="parsed" id="parsed" hidden></div>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div id="shopList"></div>

      <svg viewBox="0 0 24 24"><path d="M4 6h3l2 11h9l2-8H7.5"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Courses
      <span class="badge" id="listBadge" hidden>0</span>
    </button>

      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>Semaine

</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   Rayons : l'ordre est celui d'un parcours de magasin classique.
--------------------------------------------------------------- */
const RAYONS = [
  ["fruits",      "Fruits & légumes"],
  ["boucherie",   "Boucherie & poissonnerie"],
  ["cremerie",    "Crémerie & œufs"],
  ["boulangerie", "Boulangerie"],
  ["epicerie",    "Épicerie salée"],
  ["sucre",       "Épicerie sucrée"],
  ["surgeles",    "Surgelés"],
  ["boissons",    "Boissons"],
  ["maison",      "Entretien & maison"],
  ["divers",      "Divers"]
];
const RAYON_NAME = Object.fromEntries(RAYONS);

const GUESS = {
  fruits:["tomate","salade","laitue","roquette","carotte","courgette","aubergine","poireau","oignon","echalote","ail","pomme de terre","patate","champignon","brocoli","chou","haricot vert","epinard","poivron","concombre","radis","navet","celeri","potiron","courge","butternut","betterave","fenouil","citron","orange","clementine","pomme","poire","banane","fraise","framboise","myrtille","raisin","peche","abricot","melon","pasteque","kiwi","ananas","mangue","avocat","persil","basilic","coriandre","menthe","ciboulette","thym","romarin","laurier","gingembre","petit pois frais","asperge","artichaut","endive","mache","cresson","rhubarbe","figue","prune","cerise"],
  boucherie:["poulet","boeuf","steak","hache","porc","jambon","lardon","saucisse","merguez","agneau","veau","dinde","canard","escalope","cote de","roti","saumon","cabillaud","thon frais","crevette","moule","poisson","truite","colin","lieu","sardine","bacon","chorizo","andouille","boudin","gigot","poitrine","filet mignon","magret","noix de saint","calamar","dorade","maquereau"],
  cremerie:["lait","beurre","creme","yaourt","fromage","gruyere","emmental","parmesan","comte","mozzarella","chevre","feta","oeuf","ricotta","mascarpone","raclette","camembert","roquefort","skyr","petit suisse","cancoillotte","bleu","brebis","pate feuilletee","pate brisee","pate a pizza"],
  boulangerie:["pain","baguette","brioche","croissant","biscotte","wrap","tortilla","pita","viennoiserie","chapelure","pain de mie"],
  epicerie:["pate","spaghetti","tagliatelle","penne","macaroni","lasagne","riz","semoule","couscous","lentille","pois chiche","haricot sec","quinoa","boulgour","farine","huile","vinaigre","sel","poivre","moutarde","ketchup","mayonnaise","sauce","concentre de tomate","tomate pelee","tomate concassee","conserve","thon","bouillon","curry","paprika","cumin","curcuma","herbes","olive","cornichon","mais","soja","lait de coco","polenta","nouille","cube","fecule","maizena","piment","muscade","cannelle","safran","gomasio","tahin","harissa","pesto","anchois","capre","noix de cajou"],
  sucre:["sucre","chocolat","miel","confiture","biscuit","gateau","levure","vanille","cereale","compote","bonbon","amande","noisette","noix","raisin sec","sirop","cacao","creme dessert","pate a tartiner","madeleine","speculoos","meringue","praline"],
  surgeles:["surgele","glace","petits pois","poelee","frite","epinards surgeles","nuggets","pizza surgelee","sorbet"],
  boissons:["eau","jus","vin","biere","soda","cafe","the","infusion","limonade","lait d'amande","lait de soja","cidre","champagne","sirop de menthe","perrier","coca"],
  maison:["papier toilette","essuie-tout","lessive","liquide vaisselle","eponge","sac poubelle","savon","shampoing","dentifrice","mouchoir","gel douche","nettoyant","deodorant","couche","coton","aluminium","papier cuisson","adoucissant","javel","filtre"]
};

const UNITS = ["g","kg","mg","ml","cl","dl","l","cs","cc","cuil","cuillere","cuilleres","pincee","pincees","tranche","tranches","gousse","gousses","botte","bottes","boite","boites","paquet","paquets","sachet","sachets","pot","pots","bouteille","bouteilles","brique","briques","barquette","barquettes","tasse","tasses","verre","verres","filet","branche","branches","feuille","feuilles","tete","conserve","rouleau","rouleaux","part","parts"];

const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const SLOTS = [["midi","Midi"],["soir","Soir"]];
const CATEGORIES = ["Plat","Entrée","Dessert","Petit-déj","Apéro","Accompagnement"];

/* Recettes de départ : uniquement pour le mode hors-ligne, quand la
   base partagée n'est pas disponible dans cette vue. */
const STARTERS = [
  {id:"gratin-courgettes",name:"Gratin de courgettes au chèvre",category:"Plat",servings:4,minutes:45,
   ingredients:[{name:"Courgettes",qty:4,unit:"",rayon:"fruits"},{name:"Bûche de chèvre",qty:150,unit:"g",rayon:"cremerie"},{name:"Crème fraîche",qty:20,unit:"cl",rayon:"cremerie"},{name:"Œufs",qty:2,unit:"",rayon:"cremerie"},{name:"Chapelure",qty:2,unit:"cs",rayon:"boulangerie"},{name:"Huile d'olive",qty:1,unit:"cs",rayon:"epicerie"}],
   steps:["Couper les courgettes en rondelles et les faire revenir 10 min à l'huile d'olive.","Battre les œufs avec la crème, saler, poivrer.","Alterner courgettes et rondelles de chèvre dans un plat, verser l'appareil.","Parsemer de chapelure et enfourner 30 min à 180 °C."]}
];

/* --------------------------- utilitaires --------------------------- */
const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function slug(s){
  const out = norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
  return out || "x";
}
function itemId(name, unit){ return slug(name) + "--" + slug(unit||"u"); }
function fmtQty(n){
  if(n==null || isNaN(n)) return "";
  const r = Math.round(n*100)/100;
  return String(r).replace(".",",");
}
function guessRayon(name){
  const n = " " + norm(name) + " ";
  let best = "divers", len = 0;
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words){
      if(n.includes(w) && w.length > len){ best = rayon; len = w.length; }
    }
  }
  return best;
}
function parseQuick(text){
  let rest = (text||"").trim().replace(/\s+/g," ");
  let qty = null, unit = "";
  const m = rest.match(/^(\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(.*)$/);
  if(m){
    const raw = m[1].replace(",",".");
    qty = raw.includes("/") ? (parseFloat(raw.split("/")[0]) / parseFloat(raw.split("/")[1])) : parseFloat(raw);
    rest = m[2];
    const u = rest.match(/^([^\s]+)\s+(.+)$/);
    if(u && UNITS.includes(norm(u[1]).replace(/\.$/,""))){ unit = u[1]; rest = u[2]; }
    else{
      const glued = m[2].match(/^(kg|g|mg|ml|cl|dl|l)\s*(.*)$/i);
      if(glued && glued[2]){ unit = glued[1].toLowerCase(); rest = glued[2]; }
    }
  }
  rest = rest.trim();
  if(rest) rest = rest.charAt(0).toUpperCase() + rest.slice(1);
  return {qty, unit, name:rest};
}
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ------------------------------ store ------------------------------ */
const COLS = ["recipes","shopping","plan"];
const state = { recipes:new Map(), shopping:new Map(), plan:new Map(), tab:"recipes", editing:null, ready:false };
let store = null;

function clean(body){
  const out = {};
  for(const [k,v] of Object.entries(body)){ if(k!=="id" && v!==undefined) out[k]=v; }
  return out;
}
function liveStore(db){
  return {
    kind:"live",
    watch(col, cb){
      return db.collection(col).onSnapshot(snap=>{
        const m = new Map();
        snap.docs.forEach(d=>{ if(d.exists) m.set(d.id, Object.assign({}, d.data(), {id:d.id})); });
        cb(m);
      }, err=>{
        setSync("local", "Hors ligne");
        if(err && err.code === "revoked") toast("Accès à la base retiré.");
      });
    },
    put(col,id,body){ return db.collection(col).doc(id).set(clean(body)); },
    remove(col,id){ return db.collection(col).doc(id).delete(); }
  };
}
function localStore(){
  const subs = {};
  const read = col => {
    try{ return new Map(Object.entries(JSON.parse(localStorage.getItem("panier:"+col) || "{}"))); }
    catch(e){ return new Map(); }
  };
  const write = (col, map) => {
    try{ localStorage.setItem("panier:"+col, JSON.stringify(Object.fromEntries(map))); }catch(e){}
    if(subs[col]) subs[col](new Map(map));
  };
  return {
    kind:"local",
    watch(col, cb){ subs[col] = cb; setTimeout(()=>cb(read(col)), 0); return ()=>{ delete subs[col]; }; },
    put(col,id,body){ const m = read(col); m.set(id, Object.assign(clean(body), {id})); write(col,m); return Promise.resolve(); },
    remove(col,id){ const m = read(col); m.delete(id); write(col,m); return Promise.resolve(); }
  };
}
function setSync(kind, label){
  const el = $("#sync");
  el.dataset.state = kind;
  $("#syncLabel").textContent = label;
}
async function save(col,id,body){
  try{ await store.put(col,id,body); }
  catch(e){ toast(e && e.code === "quota_exceeded" ? "La base est pleine, videz des articles." : "Enregistrement impossible, réessayez."); }
}
async function drop(col,id){
  try{ await store.remove(col,id); }catch(e){ toast("Suppression impossible, réessayez."); }
}

/* --------------------------- liste de courses --------------------------- */
function itemTotal(it){
  let total = 0, seen = false;
  if(it.manualQty){ total += Number(it.manualQty)||0; seen = true; }
  for(const v of Object.values(it.sources||{})){
    if(v!=null && !isNaN(v)){ total += Number(v); seen = true; }
  }
  return seen ? total : null;
}
function itemFrom(it){
  const names = Object.keys(it.sources||{}).map(rid=>{
    const r = state.recipes.get(rid); return r ? r.name : null;
  }).filter(Boolean);
  if(it.manualQty) names.unshift("Ajouté à la volée");
  return names.join(" · ");
}
async function addManual(name, qty, unit, rayon){
  if(!name) return;
  const id = itemId(name, unit);
  const cur = state.shopping.get(id);
  const body = cur ? Object.assign({}, cur) : {name, unit:unit||"", rayon:rayon||guessRayon(name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
  body.sources = Object.assign({}, body.sources||{});
  const add = (qty==null ? (itemTotal(body)==null ? null : 1) : qty);
  if(add!=null) body.manualQty = (Number(body.manualQty)||0) + add;
  body.done = false;
  body.name = body.name || name;
  await save("shopping", id, body);
  toast(add!=null ? `${fmtQty(add)} ${unit||""} ${name} ajouté`.replace(/\s+/g," ") : `${name} ajouté`);
}
async function recipeToList(recipe, servings){
  const factor = (servings||recipe.servings||1) / (recipe.servings||1);
  for(const ing of (recipe.ingredients||[])){
    const id = itemId(ing.name, ing.unit);
    const cur = state.shopping.get(id);
    const body = cur ? Object.assign({}, cur) : {name:ing.name, unit:ing.unit||"", rayon:ing.rayon||guessRayon(ing.name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
    body.sources = Object.assign({}, body.sources||{});
    body.sources[recipe.id] = ing.qty==null ? null : Math.round(ing.qty*factor*100)/100;
    body.done = false;
    await save("shopping", id, body);
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:true, listServings:servings||recipe.servings||null}));
}
async function recipeOffList(recipe){
  for(const [id, it] of state.shopping){
    if(!it.sources || !(recipe.id in it.sources)) continue;
    const sources = Object.assign({}, it.sources);
    delete sources[recipe.id];
    if(Object.keys(sources).length === 0 && !it.manualQty) await drop("shopping", id);
    else await save("shopping", id, Object.assign({}, it, {sources}));
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:false, listServings:null}));
}

/* ------------------------------ rendu ------------------------------ */
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';

function render(){
  renderHead();
  renderRecipes();
  renderList();
  renderWeek();
  const undone = [...state.shopping.values()].filter(i=>!i.done).length;
  const badge = $("#listBadge");
  badge.hidden = undone === 0;
  badge.textContent = undone > 99 ? "99" : undone;
}

function renderHead(){
  const titles = {recipes:"Recettes", list:"Liste de courses", week:"Repas de la semaine"};
  $("#viewTitle").textContent = titles[state.tab];
  const count = $("#viewCount");
  const acts = $("#headActions");
  if(state.tab === "recipes"){
    const n = state.recipes.size;
    count.textContent = n ? n + (n>1 ? " recettes" : " recette") : "";
    acts.innerHTML = '<button class="btn btn-primary" data-act="new-recipe"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Recette</button>';
  } else if(state.tab === "list"){
    const undone = [...state.shopping.values()].filter(i=>!i.done).length;
    const done = state.shopping.size - undone;
    count.textContent = state.shopping.size ? undone + " à prendre" : "";
    acts.innerHTML = done ? '<button class="btn btn-quiet" data-act="clear-done">Retirer les ' + done + ' cochés</button>' : "";
  } else {
    const planned = [...state.plan.values()].filter(p=>p.recipeId).length;
    count.textContent = planned ? planned + (planned>1 ? " repas" : " repas") : "";
    acts.innerHTML = planned
      ? '<button class="btn btn-primary" data-act="week-to-list">Tout aux courses</button><button class="btn btn-quiet" data-act="clear-week">Vider</button>'
      : "";
  }
}

function renderRecipes(){
  const ul = $("#recipeList");
  const recipes = [...state.recipes.values()].sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr"));
  if(!recipes.length){
    ul.innerHTML = '<li>' + (state.ready
      ? '<div class="empty"><strong>Aucune recette pour l’instant</strong>Touchez « Recette » en haut pour écrire la première : ses ingrédients partiront ensuite dans les courses en un geste.</div>'
      : '<div class="empty">Chargement…</div>') + '</li>';
    return;
  }
  ul.innerHTML = recipes.map(r=>{
    const meta = [];
    if(r.category) meta.push('<span class="cat">' + esc(r.category) + '</span>');
    if(r.servings) meta.push('<span class="num">' + esc(r.servings) + ' pers.</span>');
    if(r.minutes) meta.push('<span class="num">' + esc(r.minutes) + ' min</span>');
    meta.push('<span>' + ((r.ingredients||[]).length) + ' ingr.</span>');
    return '<li class="tile" data-inlist="' + (r.inList ? 1 : 0) + '">' +
      '<button class="tile-open" data-act="open-recipe" data-id="' + esc(r.id) + '">' +
        '<h3 class="tile-name">' + esc(r.name) + '</h3>' +
        '<div class="tile-meta">' + meta.join("") + '</div>' +
      '</button>' +
      '<button class="tile-check" data-act="toggle-recipe" data-id="' + esc(r.id) + '" aria-pressed="' + (r.inList?"true":"false") + '" aria-label="Ajouter les ingrédients aux courses">' +
        '<span class="box">' + ICON_CHECK + '</span>' + (r.inList ? "dans<br>la liste" : "aux<br>courses") +
      '</button></li>';
  }).join("");
}

function renderList(){
  const wrap = $("#shopList");
  const items = [...state.shopping.values()];
  if(!items.length){
    wrap.innerHTML = state.ready
      ? '<div class="empty"><strong>Liste vide</strong>Tapez ce qu’il vous faut dans la barre ci-dessus — « 2 kg pommes de terre », « 6 œufs » — ou cochez une recette dans l’onglet Recettes.</div>'
      : '<div class="empty">Chargement…</div>';
    return;
  }
  const byRayon = new Map();
  for(const it of items){
    const r = RAYON_NAME[it.rayon] ? it.rayon : "divers";
    if(!byRayon.has(r)) byRayon.set(r, []);
    byRayon.get(r).push(it);
  }
  let html = "";
  for(const [key, label] of RAYONS){
    const list = byRayon.get(key);
    if(!list) continue;
    list.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || (a.name||"").localeCompare(b.name||"","fr"));
    const left = list.filter(i=>!i.done).length;
    html += '<section class="aisle"><div class="aisle-head"><h3>' + esc(label) + '</h3><span class="rule"></span>' +
            '<span class="n">' + left + "/" + list.length + '</span></div><ul class="items">';
    for(const it of list){
      const total = itemTotal(it);
      const from = itemFrom(it);
      html += '<li class="item' + (state.editing === it.id ? " editing" : "") + '" data-done="' + (it.done?1:0) + '" data-id="' + esc(it.id) + '">' +
        '<div class="item-row">' +
          '<button class="tick" data-act="tick" data-id="' + esc(it.id) + '" aria-pressed="' + (it.done?"true":"false") + '" aria-label="Cocher ' + esc(it.name) + '">' + ICON_CHECK + '</button>' +
          '<button class="item-body" data-act="edit-item" data-id="' + esc(it.id) + '">' +
            '<span class="item-name">' + esc(it.name) + '</span>' +
            (from ? '<span class="item-from">' + esc(from) + '</span>' : "") +
          '</button>' +
          (total!=null ? '<span class="qty">' + esc(fmtQty(total) + (it.unit ? " " + it.unit : "")) + '</span>' : "") +
        '</div>' +
        '<div class="editor">' +
          '<input type="number" step="any" min="0" name="qty" value="' + (total!=null?esc(total):"") + '" data-id="' + esc(it.id) + '" aria-label="Quantité" placeholder="qté">' +
          '<input name="unit" value="' + esc(it.unit||"") + '" data-id="' + esc(it.id) + '" aria-label="Unité" placeholder="unité">' +
          '<select name="rayon" data-id="' + esc(it.id) + '" aria-label="Rayon">' +
            RAYONS.map(([k,l])=>'<option value="' + k + '"' + (k===(it.rayon||"divers")?" selected":"") + '>' + esc(l) + '</option>').join("") +
          '</select>' +
          '<button class="rm" data-act="remove-item" data-id="' + esc(it.id) + '">Supprimer</button>' +
        '</div></li>';
    }
    html += "</ul></section>";
  }
  wrap.innerHTML = html;
}

function renderWeek(){
  const today = (new Date().getDay() + 6) % 7;
  $("#weekList").innerHTML = DAYS.map((day, i)=>{
    const slots = SLOTS.map(([key,label])=>{
      const p = state.plan.get("d" + i + "_" + key);
      const name = p && p.recipeId && state.recipes.get(p.recipeId) ? state.recipes.get(p.recipeId).name : (p && p.name) || "";
      return '<button class="slot" data-act="pick" data-slot="d' + i + "_" + key + '">' +
        '<span class="when">' + label + '</span>' +
        '<span class="what' + (name ? "" : " none") + '">' + (name ? esc(name) : "à décider") + '</span>' +
        '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>';
    }).join("");
    return '<article class="day' + (i===today ? " today" : "") + '"><div class="day-name">' + day + '</div>' + slots + '</article>';
  }).join("");
}

/* ------------------------------ feuilles ------------------------------ */
function openSheet(html){
  $("#sheet").innerHTML = html;
  $("#scrim").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  sheetRecipeId = null;
  $("#scrim").classList.remove("open");
  $("#sheet").innerHTML = "";
  document.body.style.overflow = "";
}
const CLOSE_BTN = '<button class="sheet-close" data-act="close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';

let sheetServings = null, sheetRecipeId = null;
function openRecipe(id){
  const r = state.recipes.get(id);
  if(!r) return;
  sheetRecipeId = id;
  sheetServings = r.servings || 4;
  openSheet(recipeSheetHTML(r));
}
function recipeSheetHTML(r){
  const base = r.servings || 1;
  const factor = sheetServings / base;
  const meta = [r.category, r.minutes ? r.minutes + " min" : null].filter(Boolean).join(" · ");
  const ings = (r.ingredients||[]).map(ing=>
    '<li><span class="q">' + esc(ing.qty!=null ? fmtQty(ing.qty*factor) + (ing.unit ? " " + ing.unit : "") : "—") + '</span>' +
    '<span class="n">' + esc(ing.name) + '</span></li>').join("");
  const steps = (r.steps||[]).filter(Boolean).map(s=>"<li>" + esc(s) + "</li>").join("");
  return '<div class="sheet-head"><h2>' + esc(r.name) + '</h2>' + CLOSE_BTN + '</div>' +
    '<div class="sheet-body">' +
      (meta ? '<p style="margin:0 0 14px;color:var(--muted);font-size:13px">' + esc(meta) + '</p>' : "") +
      '<div class="servings"><span>Pour</span><span class="stepper">' +
        '<button data-act="serv-" aria-label="Moins de parts">−</button><span>' + sheetServings + '</span>' +
        '<button data-act="serv+" aria-label="Plus de parts">+</button></span><span>personnes</span></div>' +
      '<div class="subhead">Ingrédients<span class="rule"></span></div><ul class="ing">' + (ings || '<li><span class="n" style="color:var(--muted)">Aucun ingrédient noté</span></li>') + '</ul>' +
      (steps ? '<div class="subhead">Préparation<span class="rule"></span></div><ol class="steps">' + steps + '</ol>' : "") +
      '<p class="note">Écrite par vous deux, lisible par vous deux.</p>' +
    '</div>' +
    '<div class="sheet-foot">' +
      '<button class="btn btn-quiet" data-act="del-recipe" data-id="' + esc(r.id) + '">Supprimer</button>' +
      (r.inList
        ? '<button class="btn" data-act="toggle-recipe" data-id="' + esc(r.id) + '">Retirer des courses</button>'
        : '<button class="btn btn-primary" data-act="add-servings" data-id="' + esc(r.id) + '">Ajouter pour ' + sheetServings + ' pers.</button>') +
    '</div>';
}

function openNewRecipe(){
  openSheet(
    '<div class="sheet-head"><h2>Nouvelle recette</h2>' + CLOSE_BTN + '</div>' +
    '<form class="sheet-body" id="recipeForm">' +
      '<div class="field"><label for="rName">Nom</label><input id="rName" name="name" required placeholder="Gratin de courgettes"></div>' +
      '<div class="row2">' +
        '<div class="field"><label for="rCat">Catégorie</label><select id="rCat" name="category">' + CATEGORIES.map(c=>'<option>' + c + '</option>').join("") + '</select></div>' +
        '<div class="field"><label for="rServ">Personnes</label><input id="rServ" name="servings" type="number" min="1" max="30" value="4"></div>' +
        '<div class="field"><label for="rMin">Minutes</label><input id="rMin" name="minutes" type="number" min="0" max="999" placeholder="45"></div>' +
      '</div>' +
      '<div class="field"><label>Ingrédients</label><div id="ingRows"></div>' +
        '<div class="hint">Quantité, unité, nom. Le rayon est deviné tout seul — corrigeable depuis la liste de courses.</div></div>' +
      '<div class="field"><label for="rSteps">Préparation</label><textarea id="rSteps" name="steps" placeholder="Une étape par ligne."></textarea></div>' +
    '</form>' +
    '<div class="sheet-foot"><button class="btn" data-act="close">Annuler</button>' +
    '<button class="btn btn-primary" data-act="save-recipe">Enregistrer</button></div>'
  );
  addIngRow(); addIngRow(); addIngRow();
}
function addIngRow(){
  const wrap = document.getElementById("ingRows");
  if(!wrap) return;
  const div = document.createElement("div");
  div.className = "ingrow";
  div.innerHTML = '<input class="q" name="q" inputmode="decimal" placeholder="200" aria-label="Quantité">' +
    '<input class="u" name="u" placeholder="g" aria-label="Unité">' +
    '<input class="n" name="n" placeholder="Farine" aria-label="Ingrédient">' +
    '<button type="button" class="x" data-act="rm-ing" aria-label="Retirer la ligne">×</button>';
  wrap.appendChild(div);
}
async function saveRecipe(){
  const form = document.getElementById("recipeForm");
  if(!form) return;
  const fld = n => form.querySelector('[name="' + n + '"]');
  const name = fld("name").value.trim();
  if(!name){ fld("name").focus(); toast("Il manque le nom de la recette."); return; }
  const ingredients = [...document.querySelectorAll("#ingRows .ingrow")].map(row=>{
    const n = row.querySelector('[name="n"]').value.trim();
    if(!n) return null;
    const qRaw = row.querySelector('[name="q"]').value.trim().replace(",",".");
    const q = qRaw === "" ? null : parseFloat(qRaw);
    const u = row.querySelector('[name="u"]').value.trim();
    return {name:n, qty:(q!=null && !isNaN(q)) ? q : null, unit:u, rayon:guessRayon(n)};
  }).filter(Boolean);
  const steps = fld("steps").value.split("\n").map(s=>s.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean);
  const id = slug(name) + "-" + Math.random().toString(36).slice(2,6);
  await save("recipes", id, {
    name, category:fld("category").value, servings:parseInt(fld("servings").value,10)||4,
    minutes:parseInt(fld("minutes").value,10)||null, ingredients, steps, inList:false, createdAt:Date.now()
  });
  closeSheet();
  toast("« " + name + " » enregistrée");
}

function openPicker(slotId){
  const recipes = [...state.recipes.values()].sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr"));
  const [dpart, spart] = slotId.split("_");
  const title = DAYS[parseInt(dpart.slice(1),10)] + " · " + (spart === "midi" ? "midi" : "soir");
  openSheet(
    '<div class="sheet-head"><h2>' + esc(title) + '</h2>' + CLOSE_BTN + '</div>' +
    '<div class="sheet-body"><ul class="picklist">' +
      (recipes.length ? recipes.map(r=>'<li><button data-act="set-slot" data-slot="' + esc(slotId) + '" data-id="' + esc(r.id) + '">' +
        esc(r.name) + '<span class="cat">' + esc(r.category||"") + '</span></button></li>').join("")
        : '<li><div class="empty">Ajoutez d’abord une recette.</div></li>') +
    '</ul></div>' +
    '<div class="sheet-foot"><button class="btn btn-quiet" data-act="set-slot" data-slot="' + esc(slotId) + '" data-id="">Vider ce repas</button></div>'
  );
}

/* --------------------------- barre de recherche --------------------------- */
function catalog(){
  const out = new Map();
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words) out.set(w, {name:w.charAt(0).toUpperCase()+w.slice(1), rayon});
  }
  for(const r of state.recipes.values()){
    for(const ing of (r.ingredients||[])) out.set(norm(ing.name), {name:ing.name, rayon:ing.rayon||guessRayon(ing.name), unit:ing.unit});
  }
  for(const it of state.shopping.values()) out.set(norm(it.name), {name:it.name, rayon:it.rayon, unit:it.unit});
  return [...out.values()];
}
function refreshAddBar(){
  const raw = $("#addInput").value;
  const p = parseQuick(raw);
  const parsed = $("#parsed");
  const sug = $("#suggest");
  if(!raw.trim()){ parsed.hidden = true; sug.hidden = true; return; }
  if(p.name){
    parsed.hidden = false;
    parsed.innerHTML = (p.qty!=null ? '<b>' + esc(fmtQty(p.qty) + (p.unit ? " " + p.unit : "")) + '</b>' : '<b>1</b>') +
      '<span>' + esc(p.name) + '</span><span class="ray">→ ' + esc(RAYON_NAME[guessRayon(p.name)]) + '</span>';
  } else parsed.hidden = true;
  const q = norm(p.name);
  const hits = q.length >= 2 ? catalog().filter(c=>norm(c.name).includes(q)).slice(0,6) : [];
  if(!hits.length){ sug.hidden = true; return; }
  sug.hidden = false;
  sug.innerHTML = hits.map(c=>'<button type="button" data-act="suggest" data-name="' + esc(c.name) + '" data-rayon="' + esc(c.rayon||"divers") + '" data-unit="' + esc(c.unit||"") + '">' +
    esc(c.name) + '<span class="r">' + esc(RAYON_NAME[c.rayon]||"Divers") + '</span></button>').join("");
}

/* ------------------------------ événements ------------------------------ */
document.addEventListener("click", async (ev)=>{
  const btn = ev.target.closest("[data-act]");
  if(!btn){
    if(!ev.target.closest(".addbar")) $("#suggest").hidden = true;
    return;
  }
  const act = btn.dataset.act, id = btn.dataset.id;
  if(act === "close"){ closeSheet(); return; }

  if(act === "new-recipe"){ openNewRecipe(); return; }
  if(act === "save-recipe"){ await saveRecipe(); return; }
  if(act === "rm-ing"){
    const rows = document.querySelectorAll("#ingRows .ingrow");
    if(rows.length > 1) btn.closest(".ingrow").remove(); else btn.closest(".ingrow").querySelectorAll("input").forEach(i=>i.value="");
    return;
  }
  if(act === "open-recipe"){ openRecipe(id); return; }
  if(act === "toggle-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    if(r.inList){ await recipeOffList(r); toast("Ingrédients retirés des courses"); }
    else { await recipeToList(r, r.servings); toast("Ingrédients ajoutés aux courses"); }
    if($("#scrim").classList.contains("open")) closeSheet();
    return;
  }
  if(act === "add-servings"){
    const r = state.recipes.get(id); if(!r) return;
    await recipeToList(r, sheetServings);
    closeSheet(); toast("Ingrédients ajoutés pour " + sheetServings + " personnes");
    return;
  }
  if(act === "del-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    if(r.inList) await recipeOffList(r);
    await drop("recipes", id);
    for(const [slotId, p] of state.plan){ if(p.recipeId === id) await drop("plan", slotId); }
    closeSheet(); toast("Recette supprimée");
    return;
  }
  if(act === "serv-" || act === "serv+"){
    const open = state.recipes.get(sheetRecipeId);
    if(!open) return;
    sheetServings = Math.max(1, Math.min(30, sheetServings + (act === "serv+" ? 1 : -1)));
    $("#sheet").innerHTML = recipeSheetHTML(open);
    return;
  }

  if(act === "tick"){
    const it = state.shopping.get(id); if(!it) return;
    await save("shopping", id, Object.assign({}, it, {done:!it.done}));
    return;
  }
  if(act === "edit-item"){
    state.editing = state.editing === id ? null : id;
    renderList();
    const input = document.querySelector('.item.editing input[name="qty"]');
    if(input) input.focus();
    return;
  }
  if(act === "remove-item"){
    state.editing = null;
    await drop("shopping", id);
    return;
  }
  if(act === "clear-done"){
    for(const [iid, it] of [...state.shopping]) if(it.done) await drop("shopping", iid);
    toast("Articles cochés retirés");
    return;
  }
  if(act === "suggest"){
    const p = parseQuick($("#addInput").value);
    await addManual(btn.dataset.name, p.qty, p.unit || btn.dataset.unit || "", btn.dataset.rayon);
    $("#addInput").value = ""; refreshAddBar(); $("#addInput").focus();
    return;
  }

  if(act === "pick"){ openPicker(btn.dataset.slot); return; }
  if(act === "set-slot"){
    const slot = btn.dataset.slot;
    if(!id) await drop("plan", slot);
    else{
      const r = state.recipes.get(id);
      await save("plan", slot, {recipeId:id, name:r ? r.name : "", updatedAt:Date.now()});
    }
    closeSheet();
    return;
  }
  if(act === "clear-week"){
    for(const [slotId] of [...state.plan]) await drop("plan", slotId);
    toast("Semaine vidée");
    return;
  }
  if(act === "week-to-list"){
    const ids = new Set([...state.plan.values()].map(p=>p.recipeId).filter(Boolean));
    let n = 0;
    for(const rid of ids){
      const r = state.recipes.get(rid);
      if(r && !r.inList){ await recipeToList(r, r.servings); n++; }
    }
    toast(n ? n + (n>1 ? " recettes ajoutées aux courses" : " recette ajoutée aux courses") : "Tout est déjà dans la liste");
    return;
  }
});

document.addEventListener("change", async (ev)=>{
  const el = ev.target;
  if(!el.closest || !el.closest(".editor")) return;
  const id = el.dataset.id;
  const it = state.shopping.get(id);
  if(!it) return;
  const body = Object.assign({}, it);
  if(el.name === "rayon") body.rayon = el.value;
  if(el.name === "unit") body.unit = el.value.trim();
  if(el.name === "qty"){
    const v = el.value.trim() === "" ? null : parseFloat(el.value.replace(",","."));
    body.sources = {};
    body.manualQty = (v!=null && !isNaN(v)) ? v : 0;
  }
  if(el.name === "unit" || el.name === "qty"){
    const newId = itemId(body.name, body.unit);
    if(newId !== id){ await drop("shopping", id); state.editing = newId; await save("shopping", newId, body); return; }
  }
  await save("shopping", id, body);
});

$("#addForm").addEventListener("submit", async (ev)=>{
  ev.preventDefault();
  const p = parseQuick($("#addInput").value);
  if(!p.name) return;
  await addManual(p.name, p.qty, p.unit, guessRayon(p.name));
  $("#addInput").value = ""; refreshAddBar();
});
$("#addInput").addEventListener("input", refreshAddBar);

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    state.tab = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", String(t === tab)));
    document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id === "view-" + state.tab));
    window.scrollTo({top:0});
    renderHead();
  });
});

$("#scrim").addEventListener("click", ev=>{ if(ev.target === $("#scrim")) closeSheet(); });
document.addEventListener("keydown", ev=>{
  if(ev.key === "Escape" && $("#scrim").classList.contains("open")) closeSheet();
  if(ev.key === "Escape") $("#suggest").hidden = true;
});
document.addEventListener("input", ev=>{
  if(ev.target.closest && ev.target.closest("#ingRows")){
    const rows = document.querySelectorAll("#ingRows .ingrow");
    const last = rows[rows.length-1];
    if(last && [...last.querySelectorAll("input")].some(i=>i.value.trim())) addIngRow();
  }
});

/* ------------------------------ démarrage ------------------------------ */
render();

(async function boot(){
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(db){
    store = liveStore(db);
    setSync("live", "Partagé");
  } else {
    store = localStore();
    setSync("local", "Ce téléphone");
    try{
      if(!localStorage.getItem("panier:recipes")){
        const seed = {};
        for(const r of STARTERS) seed[r.id] = r;
        localStorage.setItem("panier:recipes", JSON.stringify(seed));
      }
    }catch(e){}
  }
  for(const col of COLS){
    store.watch(col, map=>{ state[col] = map; state.ready = true; render(); });
  }
  setTimeout(()=>{ state.ready = true; render(); }, 1500);
})();

})();
</script>
